name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: rollback-risk-lint
          - runner: macos-15
            target: aarch64-apple-darwin
            exe: rollback-risk-lint
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            exe: rollback-risk-lint.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test release binary
        shell: bash
        run: |
          target/${{ matrix.target }}/release/${{ matrix.exe }} --version
          target/${{ matrix.target }}/release/${{ matrix.exe }} --diff examples/risky.patch --format json --fail-on never
      - name: Package binary and checksums
        run: python3 scripts/package.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rollback-risk-lint-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
