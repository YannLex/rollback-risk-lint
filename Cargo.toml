[package]
name = "rollback-risk-lint"
version = "0.2.0"
edition = "2024"
description = "Detect changes whose effects may outlive a service rollback"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
